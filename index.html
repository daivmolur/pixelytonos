<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Pixel&Tonos | Presentación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --blue:#2AA7FF; --indigo:#4E5EFF; --dark:#08111f; }
        html,body { height:100%; font-family:'Plus Jakarta Sans',sans-serif; overflow:hidden; background:#08111f; }
        
        header { position:fixed; top:0; left:0; right:0; height:70px; display:flex; justify-content:space-between; align-items:center; padding:0 35px; background:rgba(8,17,31,.85); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,.08); z-index:999; }
        .logo { font-size:26px; font-weight:800; letter-spacing:-1px; color:white; }
        .logo span { color:var(--blue); }
        nav { display:flex; gap:10px; }
        
        nav button { border:none; outline:none; cursor:pointer; padding:12px 20px; border-radius:14px; background:transparent; color:#CBD5E1; font-size:15px; font-weight:700; transition:.25s; }
        nav button:hover { background:rgba(255,255,255,.08); }
        nav button.active { background:linear-gradient(135deg,var(--blue),var(--indigo)); color:white; box-shadow:0 10px 25px rgba(42,167,255,.30); }
        
        #viewer { position:fixed; top:70px; left:0; width:100%; height:calc(100% - 70px); border:none; background:white; opacity:1; transition:opacity .35s; }
        #viewer.loading { opacity:.1; }
        
        .loader { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:70px; height:70px; border-radius:50%; border:5px solid rgba(255,255,255,.15); border-top:5px solid var(--blue); animation:spin .8s linear infinite; display:none; z-index:2000; }
        .loader.show { display:block; }
        
        @keyframes spin { 100% { transform:translate(-50%,-50%) rotate(360deg); } }
        
        @media(max-width:700px){
            header { padding:0 15px; height:auto; min-height:90px; flex-direction:column; justify-content:center; gap:12px; padding-top:10px; padding-bottom:10px; }
            .logo { font-size:20px; }
            nav { width:100%; justify-content:center; flex-wrap:wrap; gap:5px; }
            nav button { padding:8px 14px; font-size:13px; }
            #viewer { top:110px; height:calc(100% - 110px); }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">PIXEL<span>&</span>TONOS.</div>
    <nav>
        <button class="active" onclick="changePage('./mini-portfolio.html',this)">Portfolio</button>
        <button onclick="changePage('./servicios-pt.html',this)">Servicios</button>
        <button onclick="changePage('./luigis-review.html',this)">Diagnóstico</button>
    </nav>
</header>

<div id="loader" class="loader"></div>
<iframe id="viewer" src="./mini-portfolio.html"></iframe>

<script>
    const viewer = document.getElementById("viewer");
    const loader = document.getElementById("loader");

    function changePage(page, btn) {
        document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loader.classList.add("show");
        viewer.classList.add("loading");
        
        setTimeout(() => {
            viewer.src = page;
        }, 250);
    }

    viewer.onload = function() {
        loader.classList.remove("show");
        viewer.classList.remove("loading");
    }
</script>

</body>
</html>
